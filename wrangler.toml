# Configuración del Worker de Axioma
name = "axioma"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Archivos estáticos del juego (HTML, CSS, JavaScript, iconos)
[assets]
directory = "./public"
binding = "ASSETS"

# ---------------------------------------------------------------------------
# Base de datos para el inicio de sesión y el ranking. Es OPCIONAL: mientras
# estas líneas sigan comentadas, el juego se despliega y funciona con
# normalidad, sencillamente sin cuentas ni ranking.
#
# Para activarlo:
#   1. Ejecuta:  wrangler d1 create axioma
#   2. Copia el database_id que devuelve y pégalo abajo.
#   3. Quita el # del principio de las tres líneas siguientes.
#   4. Confirma y sube el cambio.
# ---------------------------------------------------------------------------
