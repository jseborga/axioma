# Configuración del Worker de Axioma
name = "axioma"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Archivos estáticos del juego (HTML, CSS, JavaScript, iconos)
[assets]
directory = "./public"
binding = "ASSETS"

# Base de datos D1 para usuarios y ranking.
# Crea la base con `wrangler d1 create axioma` y pega aquí el database_id que devuelve.
[[d1_databases]]
binding = "DB"
database_name = "axioma"
database_id = "PEGA-AQUI-EL-ID-DE-TU-BASE"
