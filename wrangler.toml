# Configuración del Worker de The Final Test (se llama «axioma»: no cambiar el nombre)
name = "axioma"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Archivos estáticos del juego (HTML, CSS, JavaScript, iconos)
[assets]
directory = "./public"
binding = "ASSETS"

# Base de datos para el inicio de sesión y el ranking.
# Creada con `wrangler d1 create axioma`; las tablas están en schema.sql.
[[d1_databases]]
binding = "DB"
database_name = "axioma"
database_id = "ad3327ea-8049-4330-8b69-b8081a235045"

# Ajustes de la plataforma (ver src/ajustes.js). Se cambian aquí y se
# despliegan con la app (cada despliegue impone estos valores sobre los del panel).
# Más adelante, para enviar correos y validaciones: MAIL_FROM (remitente)
# aquí, y la clave del servicio de correo como Secret, nunca en este archivo.
[vars]
APP_NAME = "The Final Test"
CONTACT_EMAIL = "julioseborga@gmail.com"
